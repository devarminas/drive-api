name: Deploy Prod

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/infrastructure.yaml"
  workflow_dispatch: {}

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: arminasdev/drive-api

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      shortSha: ${{ steps.gitversion.outputs.shortSha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true

  build-and-push:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ needs.version.outputs.semVer }}
      image-url: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ needs.version.outputs.semVer }}
          SHORT_SHA: ${{ needs.version.outputs.shortSha }}
        run: |
          # Build with version build arg
          docker build \
            --build-arg VERSION=$VERSION \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --file Dockerfile \
            .

          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${{ needs.version.outputs.semVer }}" -m "Release version ${{ needs.version.outputs.semVer }}"
          git push origin "v${{ needs.version.outputs.semVer }}"

  deploy-infrastructure:
    needs: [version, build-and-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/infrastructure/prod

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="image_tag=${{ needs.version.outputs.semVer }}" -no-color
        continue-on-error: true

      - name: Terraform Apply
        run: terraform apply -var="image_tag=${{ needs.version.outputs.semVer }}" -auto-approve -no-color

  deploy-apprunner:
    needs: [version, build-and-push, deploy-infrastructure]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update App Runner service
        run: |
          # Get the service ARN
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='drive-api-prod'].ServiceArn" --output text)
          
          if [ -n "$SERVICE_ARN" ]; then
            echo "Updating App Runner service: $SERVICE_ARN"
            aws apprunner start-deployment --service-arn $SERVICE_ARN
            
            # Wait for deployment to complete
            aws apprunner wait --max-attempts 30 --delay 30 \
              service-deployment-finished --service-arn $SERVICE_ARN
          else
            echo "App Runner service not found - infrastructure deployment will handle this"
          fi